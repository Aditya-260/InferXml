version: '3.8'

services:
  # Override Backend for GPU
  backend:
    build:
      args:
        BASE_IMAGE: nvidia/cuda:11.8.0-runtime-ubuntu22.04
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

  # Override Celery for GPU
  celery:
    build:
      args:
        BASE_IMAGE: nvidia/cuda:11.8.0-runtime-ubuntu22.04
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

  # Override Streamlit for GPU
  streamlit:
    build:
      args:
        BASE_IMAGE: nvidia/cuda:11.8.0-runtime-ubuntu22.04
        TF_PACKAGE: tensorflow==2.15.0
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
